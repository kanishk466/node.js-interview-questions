<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Node.js Interview Prep</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,700;1,400&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050a08;
  --surface: #080f0c;
  --card: #0d1a14;
  --border: #1a2e22;
  --accent: #00ff88;
  --accent2: #00ccff;
  --accent3: #ffcc00;
  --accent4: #ff6b6b;
  --text: #e0ffe8;
  --muted: #4a7a5a;
  --done: #00ff88;
  --tag-bg: #0d1a14;
  --node-green: #68a063;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Outfit', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Scanline effect */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,255,136,0.012) 2px,
    rgba(0,255,136,0.012) 4px
  );
  pointer-events: none;
  z-index: 0;
}

/* Grid background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

.layout {
  display: grid;
  grid-template-columns: 310px 1fr;
  min-height: 100vh;
  position: relative;
  z-index: 1;
}

/* ── SIDEBAR ── */
.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow: hidden;
}

.sidebar-header {
  padding: 24px 22px 18px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(0,255,136,0.04) 0%, transparent 100%);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}

.brand-icon {
  width: 40px;
  height: 40px;
  background: var(--node-green);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  color: #000;
  letter-spacing: -0.5px;
  flex-shrink: 0;
  box-shadow: 0 0 20px rgba(104,160,99,0.4);
}

.brand-info { flex: 1; min-width: 0; }

.brand-text {
  font-size: 15px;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -0.01em;
}

.brand-sub {
  font-size: 10px;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-top: 1px;
}

.terminal-bar {
  background: rgba(0,255,136,0.06);
  border: 1px solid rgba(0,255,136,0.12);
  border-radius: 6px;
  padding: 6px 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--accent);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.terminal-cursor {
  width: 6px;
  height: 12px;
  background: var(--accent);
  border-radius: 1px;
  animation: blink-cur 1s step-end infinite;
  flex-shrink: 0;
}

@keyframes blink-cur {
  0%,100% { opacity: 1; }
  50% { opacity: 0; }
}

.progress-wrap { margin-bottom: 0; }

.progress-label {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  margin-bottom: 5px;
}

.progress-bar {
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 2px;
  transition: width 0.5s ease;
  box-shadow: 0 0 8px rgba(0,255,136,0.5);
  width: 0%;
}

.mode-toggle {
  display: flex;
  gap: 6px;
  margin-top: 12px;
}

.mode-btn {
  flex: 1;
  padding: 7px 0;
  border-radius: 7px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  font-family: 'Outfit', sans-serif;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}

.mode-btn:hover { border-color: var(--accent); color: var(--accent); }
.mode-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

.nav-list {
  list-style: none;
  overflow-y: auto;
  flex: 1;
  padding: 10px 0;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.nav-list::-webkit-scrollbar { width: 3px; }
.nav-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 22px;
  cursor: pointer;
  transition: all 0.15s;
  border-left: 2px solid transparent;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--muted);
}

.nav-item:hover { background: rgba(0,255,136,0.04); color: var(--text); }

.nav-item.active {
  background: rgba(0,255,136,0.07);
  color: var(--accent);
  border-left-color: var(--accent);
}

.nav-item.done { color: var(--accent); }
.nav-item.done .nav-check { background: var(--accent); border-color: var(--accent); }
.nav-item.done .nav-check::after { opacity: 1; }

.nav-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  color: var(--muted);
  min-width: 20px;
}

.nav-check {
  width: 16px;
  height: 16px;
  border: 1.5px solid var(--border);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-left: auto;
  transition: all 0.2s;
}

.nav-check::after {
  content: '✓';
  font-size: 9px;
  color: #000;
  font-weight: 700;
  opacity: 0;
}

.sidebar-footer {
  padding: 14px 22px;
  border-top: 1px solid var(--border);
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  color: var(--muted);
}

/* ── MAIN ── */
.main {
  padding: 36px 44px;
  max-width: 920px;
}

.topic-header { margin-bottom: 32px; animation: fadeUp 0.35s ease; }

.topic-tag {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: rgba(0,255,136,0.06);
  border: 1px solid rgba(0,255,136,0.15);
  padding: 4px 12px;
  border-radius: 20px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 14px;
}

.topic-dot {
  width: 5px;
  height: 5px;
  background: var(--accent);
  border-radius: 50%;
  box-shadow: 0 0 6px var(--accent);
  animation: glow-pulse 2s infinite;
}

@keyframes glow-pulse {
  0%,100% { box-shadow: 0 0 4px var(--accent); }
  50% { box-shadow: 0 0 12px var(--accent); }
}

.topic-title {
  font-size: 32px;
  font-weight: 900;
  line-height: 1.1;
  letter-spacing: -0.02em;
  margin-bottom: 10px;
  color: var(--text);
}

.topic-title .hl { color: var(--accent); }

.topic-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.meta-pill {
  background: var(--tag-bg);
  border: 1px solid var(--border);
  padding: 3px 10px;
  border-radius: 6px;
  font-size: 10.5px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--muted);
}

.meta-pill.hard { border-color: var(--accent4); color: var(--accent4); }
.meta-pill.med  { border-color: var(--accent3); color: var(--accent3); }
.meta-pill.easy { border-color: var(--accent);  color: var(--accent);  }

/* Answer Card */
.answer-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: 18px;
  animation: fadeUp 0.35s ease;
  transition: border-color 0.2s;
}

.answer-card:hover { border-color: rgba(0,255,136,0.2); }

.card-header {
  padding: 15px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
}

.card-icon {
  width: 30px;
  height: 30px;
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
}

.card-q {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--text);
  flex: 1;
}

.expand-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--muted);
  cursor: pointer;
  padding: 3px 9px;
  font-size: 10px;
  font-family: 'JetBrains Mono', monospace;
  transition: all 0.2s;
}

.expand-btn:hover { border-color: var(--accent); color: var(--accent); }

.card-body {
  padding: 0 20px;
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease, padding 0.3s ease;
}

.card-body.open { max-height: 3000px; padding: 20px; }

.explanation {
  font-size: 13.5px;
  line-height: 1.75;
  color: #a0c8a8;
  margin-bottom: 14px;
}

.explanation strong { color: var(--text); }

pre {
  background: #020806;
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 16px 18px;
  overflow-x: auto;
  margin: 14px 0;
  position: relative;
  border-left: 3px solid rgba(0,255,136,0.3);
}

pre code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  line-height: 1.7;
  color: #a8d4b0;
}

.lang-badge {
  position: absolute;
  top: 8px;
  right: 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.tip-box {
  background: rgba(0,204,255,0.06);
  border: 1px solid rgba(0,204,255,0.2);
  border-radius: 9px;
  padding: 11px 15px;
  font-size: 12.5px;
  color: #80ccff;
  margin-top: 12px;
  display: flex;
  gap: 9px;
  align-items: flex-start;
}

.tip-icon { font-size: 13px; flex-shrink: 0; }

.warn-box {
  background: rgba(255,107,107,0.06);
  border: 1px solid rgba(255,107,107,0.2);
  border-radius: 9px;
  padding: 11px 15px;
  font-size: 12.5px;
  color: #ff9999;
  margin-top: 12px;
  display: flex;
  gap: 9px;
  align-items: flex-start;
}

.key-points { list-style: none; margin: 10px 0; }

.key-points li {
  padding: 6px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  font-size: 13px;
  color: #a0c8a8;
  display: flex;
  gap: 9px;
}

.key-points li::before { content: '▸'; color: var(--accent); flex-shrink: 0; }

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  margin: 14px 0;
}

th {
  background: rgba(0,255,136,0.05);
  padding: 9px 12px;
  text-align: left;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  border-bottom: 1px solid var(--border);
}

td {
  padding: 8px 12px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  color: #a0c8a8;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  vertical-align: top;
}

td:first-child { color: var(--accent); }

code.inline {
  background: rgba(0,255,136,0.08);
  padding: 2px 6px;
  border-radius: 4px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  color: var(--accent);
}

.mark-done-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 18px;
  background: rgba(0,255,136,0.06);
  border: 1px solid rgba(0,255,136,0.2);
  border-radius: 8px;
  padding: 9px 15px;
  color: var(--accent);
  font-family: 'Outfit', sans-serif;
  font-weight: 700;
  font-size: 12.5px;
  cursor: pointer;
  transition: all 0.2s;
  width: fit-content;
}

.mark-done-btn:hover, .mark-done-btn.marked { background: rgba(0,255,136,0.12); }

.nav-controls {
  display: flex;
  gap: 10px;
  margin-top: 28px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}

.ctrl-btn {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 9px;
  color: var(--text);
  font-family: 'Outfit', sans-serif;
  font-weight: 700;
  font-size: 12.5px;
  padding: 10px 18px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 7px;
}

.ctrl-btn:hover { border-color: var(--accent); color: var(--accent); }
.ctrl-btn.primary { background: var(--accent); color: #000; border-color: var(--accent); }
.ctrl-btn.primary:hover { background: #33ffaa; }

/* Syntax colours */
.kw-green  { color: #00ff88; }
.kw-yellow { color: #ffcc00; }
.kw-blue   { color: #00ccff; }
.kw-red    { color: #ff6b6b; }
.kw-purple { color: #cc99ff; }
.kw-gray   { color: #5a8a6a; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── QUIZ STYLES ── */
.quiz-wrap { animation: fadeUp 0.35s ease; }

.quiz-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 22px;
  flex-wrap: wrap;
  gap: 10px;
}

.quiz-badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: rgba(0,255,136,0.08);
  border: 1px solid rgba(0,255,136,0.2);
  padding: 5px 13px;
  border-radius: 20px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  color: var(--accent);
}

.quiz-score-pill {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  color: var(--muted);
  background: var(--card);
  border: 1px solid var(--border);
  padding: 5px 13px;
  border-radius: 20px;
}

.quiz-score-pill span { color: var(--accent); font-weight: 700; }

.quiz-filter-bar {
  display: flex;
  gap: 7px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}

.filter-chip {
  padding: 5px 12px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  font-size: 10.5px;
  font-family: 'JetBrains Mono', monospace;
  cursor: pointer;
  transition: all 0.15s;
}

.filter-chip:hover { border-color: var(--accent); color: var(--accent); }
.filter-chip.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }

.quiz-dots {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.q-dot {
  width: 8px;
  height: 8px;
  border-radius: 2px;
  background: var(--border);
  transition: all 0.3s;
}

.q-dot.answered  { background: var(--muted); }
.q-dot.correct-d { background: var(--accent); box-shadow: 0 0 4px var(--accent); }
.q-dot.wrong-d   { background: var(--accent4); }
.q-dot.current   { background: var(--accent2); transform: scale(1.5); box-shadow: 0 0 6px var(--accent2); }

.quiz-q-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: 12px;
  padding: 22px 24px 20px;
  margin-bottom: 16px;
}

.quiz-q-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 10px;
}

.quiz-q-text {
  font-size: 16px;
  font-weight: 700;
  line-height: 1.5;
  color: var(--text);
  margin-bottom: 8px;
}

.quiz-topic-tag {
  font-size: 10.5px;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  margin-top: 6px;
}

.quiz-options { display: grid; gap: 9px; margin-bottom: 16px; }

.quiz-option {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 13px 16px;
  cursor: pointer;
  display: flex;
  align-items: flex-start;
  gap: 11px;
  transition: all 0.18s;
  font-size: 13px;
  color: #90b898;
  line-height: 1.5;
  text-align: left;
}

.quiz-option:hover:not(.disabled) {
  border-color: var(--accent);
  background: rgba(0,255,136,0.05);
  color: var(--text);
}

.quiz-option.selected { border-color: var(--accent2); background: rgba(0,204,255,0.07); }
.quiz-option.correct  { border-color: var(--accent)!important; background: rgba(0,255,136,0.08)!important; color: var(--accent)!important; }
.quiz-option.wrong    { border-color: var(--accent4)!important; background: rgba(255,107,107,0.07)!important; color: var(--accent4)!important; }
.quiz-option.reveal-correct { border-color: rgba(0,255,136,0.4)!important; background: rgba(0,255,136,0.04)!important; }
.quiz-option.disabled { cursor: default; }

.opt-letter {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  border: 1.5px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  flex-shrink: 0;
  transition: all 0.18s;
  color: var(--muted);
}

.quiz-option:hover:not(.disabled) .opt-letter { border-color: var(--accent); color: var(--accent); }
.quiz-option.correct .opt-letter  { border-color: var(--accent); color: var(--accent); background: rgba(0,255,136,0.12); }
.quiz-option.wrong .opt-letter    { border-color: var(--accent4); color: var(--accent4); background: rgba(255,107,107,0.12); }
.quiz-option.reveal-correct .opt-letter { border-color: var(--accent); color: var(--accent); }

.quiz-feedback {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 18px;
  margin-bottom: 16px;
  display: none;
  animation: fadeUp 0.2s ease;
}

.quiz-feedback.show { display: block; }
.quiz-feedback.correct-fb { border-color: rgba(0,255,136,0.25); }
.quiz-feedback.wrong-fb   { border-color: rgba(255,107,107,0.25); }

.fb-title { font-size: 12.5px; font-weight: 800; margin-bottom: 5px; }
.correct-fb .fb-title { color: var(--accent); }
.wrong-fb   .fb-title { color: var(--accent4); }

.fb-explain { font-size: 12px; color: #7aaa88; line-height: 1.6; }
.fb-explain code { background: rgba(0,255,136,0.08); padding: 1px 5px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--accent); }

.quiz-actions { display: flex; gap: 9px; flex-wrap: wrap; }

/* Results */
.quiz-results { text-align: center; padding: 36px 16px; animation: fadeUp 0.4s ease; }

.result-ring { width: 130px; height: 130px; margin: 0 auto 22px; position: relative; }
.result-ring svg { transform: rotate(-90deg); }

.result-pct {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.result-pct-num { font-size: 28px; font-weight: 900; color: var(--text); line-height: 1; }
.result-pct-label { font-size: 9px; color: var(--muted); font-family: 'JetBrains Mono', monospace; margin-top: 2px; }

.result-grade { font-size: 24px; font-weight: 900; margin-bottom: 6px; }
.result-sub   { color: var(--muted); font-size: 13px; margin-bottom: 24px; }

.result-breakdown {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  max-width: 360px;
  margin: 0 auto 24px;
}

.rb-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
.rb-num  { font-size: 20px; font-weight: 900; }
.rb-lbl  { font-size: 9px; color: var(--muted); font-family: 'JetBrains Mono', monospace; margin-top: 2px; text-transform: uppercase; }
.rb-card.correct-rb .rb-num { color: var(--accent); }

          <div class="tip-box"><span class="tip-icon">💡</span><span>Browsers send a <strong>preflight OPTIONS request</strong> before cross-origin POST/PUT/DELETE with custom headers. Your server must respond to OPTIONS with the CORS headers or the actual request will never be sent.</span></div>
        `
      }
    ]
  }
];

// ─────────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────────
const difficultyLabel = { easy: "Basic", med: "Medium", hard: "Hard" };
let doneSet      = new Set(JSON.parse(localStorage.getItem('node_done') || '[]'));
let currentTopic = 0;
let appMode      = 'study';

let quizQuestions  = [];
let quizIdx        = 0;
let quizAnswers    = {};
let quizCorrects   = {};
let quizFilter     = 'all';
let quizShowResult = false;

// ─────────────────────────────────────────────────────────────────
// STUDY HELPERS
// ─────────────────────────────────────────────────────────────────
function saveDone() {
  localStorage.setItem('node_done', JSON.stringify([...doneSet]));
}

function updateProgress() {
  const count = doneSet.size;
  document.getElementById('prog-text').textContent = `${count} / ${topics.length}`;
  document.getElementById('prog-fill').style.width = `${(count / topics.length) * 100}%`;
}

function buildNav() {
  const list = document.getElementById('nav-list');
  list.innerHTML = '';
  let lastSection = null;
  topics.forEach((t, i) => {
    const section = t.section || 'Basic';
    if (section !== lastSection) {
      const sep = document.createElement('li');
      sep.style.cssText = 'padding:9px 22px 3px;font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:#1a4a2a;font-family:JetBrains Mono,monospace;pointer-events:none;border-top:' + (lastSection ? '1px solid #0d1a14' : 'none') + ';margin-top:' + (lastSection ? '6px' : '0');
      sep.textContent = section;
      list.appendChild(sep);
      lastSection = section;
    }
    const li = document.createElement('li');
    const num = (i + 1).toString().padStart(2, '0');
    li.className = 'nav-item' + (i === currentTopic && appMode === 'study' ? ' active' : '') + (doneSet.has(i) ? ' done' : '');
    li.innerHTML = `<span class="nav-num">${num}</span><span style="flex:1;line-height:1.3">${t.title}</span><span class="nav-check"></span>`;
    li.onclick = () => { currentTopic = i; setMode('study'); };
    list.appendChild(li);
  });
  updateProgress();
}

function buildCards(cards, topicId) {
  return cards.map((card, ci) => `
    <div class="answer-card">
      <div class="card-header" onclick="toggleCard(${topicId},${ci})">
        <div class="card-icon" style="background:${card.iconBg}">${card.icon}</div>
        <div class="card-q">${card.q}</div>
        <button class="expand-btn" onclick="toggleCard(${topicId},${ci});event.stopPropagation()" id="ebtn-${topicId}-${ci}">SHOW</button>
      </div>
      <div class="card-body" id="cbody-${topicId}-${ci}">${card.content}</div>
    </div>`).join('');
}

function toggleCard(topicId, ci) {
  const body = document.getElementById(`cbody-${topicId}-${ci}`);
  const btn  = document.getElementById(`ebtn-${topicId}-${ci}`);
  const open = body.classList.toggle('open');
  btn.textContent = open ? 'HIDE' : 'SHOW';
}

function markDone(id) {
  if (doneSet.has(id)) doneSet.delete(id); else doneSet.add(id);
  saveDone(); render();
}

function navigate(id) { currentTopic = id; render(); }

// ─────────────────────────────────────────────────────────────────
// MODE SWITCH
// ─────────────────────────────────────────────────────────────────
function setMode(mode) {
  appMode = mode;
  document.getElementById('btn-study').classList.toggle('active', mode === 'study');
  document.getElementById('btn-quiz').classList.toggle('active',  mode === 'quiz');
  if (mode === 'quiz') startQuiz(); else render();
}

// ─────────────────────────────────────────────────────────────────
// QUIZ ENGINE
// ─────────────────────────────────────────────────────────────────
function sectionOf(topicIdx) {
  return (topics[topicIdx]?.section || 'Basic').toLowerCase();
}

function startQuiz(filter) {
  if (filter !== undefined) quizFilter = filter;
  quizQuestions = quizBank.map((q, i) => ({ ...q, bankIdx: i, topicIdx: Math.floor(i / 2) }))
    .filter(q => quizFilter === 'all' || sectionOf(q.topicIdx) === quizFilter);
  for (let i = quizQuestions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [quizQuestions[i], quizQuestions[j]] = [quizQuestions[j], quizQuestions[i]];
  }
  quizIdx = 0; quizAnswers = {}; quizCorrects = {}; quizShowResult = false;
  renderQuiz();
}

function renderQuiz() {
  buildNav();
  if (quizShowResult) { renderQuizResults(); return; }

  const mc = document.getElementById('main-content');
  const q  = quizQuestions[quizIdx];
  const answered = quizAnswers[quizIdx] !== undefined;
  const letters  = ['A','B','C','D'];

  const dots = quizQuestions.map((_, i) => {
    let cls = 'q-dot';
    if (i === quizIdx) cls += ' current';
    else if (quizCorrects[i] === true)  cls += ' correct-d';
    else if (quizCorrects[i] === false) cls += ' wrong-d';
    else if (quizAnswers[i] !== undefined) cls += ' answered';
    return `<div class="${cls}"></div>`;
  }).join('');

  const optHtml = q.opts.map((opt, oi) => {
    let cls = 'quiz-option';
    if (answered) {
      cls += ' disabled';
      if (oi === q.correct) cls += ' reveal-correct';
      if (oi === quizAnswers[quizIdx]) cls += (oi === q.correct) ? ' correct' : ' wrong';
    }
    return `<button class="${cls}" onclick="answerQuiz(${oi})">
      <span class="opt-letter">${letters[oi]}</span><span>${opt}</span>
    </button>`;
  }).join('');

  const fbHtml = answered ? `
    <div class="quiz-feedback ${quizCorrects[quizIdx] ? 'correct-fb' : 'wrong-fb'} show">
      <div class="fb-title">${quizCorrects[quizIdx] ? '✅ Correct!' : '❌ Not quite'}</div>
      <div class="fb-explain">${q.explain}</div>
    </div>` : '<div class="quiz-feedback"></div>';

  const isLast = quizIdx === quizQuestions.length - 1;

  mc.innerHTML = `
    <div class="quiz-wrap">
      <div class="quiz-topbar">
        <div class="quiz-badge">⚡ Quiz Mode · ${quizFilter === 'all' ? 'All Levels' : quizFilter.charAt(0).toUpperCase() + quizFilter.slice(1)}</div>
        <div class="quiz-score-pill">Score <span>${Object.values(quizCorrects).filter(Boolean).length}</span> / ${Object.keys(quizAnswers).length}</div>
      </div>
      <div class="quiz-filter-bar">
        ${['all','basic','intermediate'].map(f => `
          <button class="filter-chip ${quizFilter===f?'active':''}" onclick="startQuiz('${f}')">
            ${f==='all'?'🌐 All':f==='basic'?'🟢 Basic':'🟡 Intermediate'}
          </button>`).join('')}
      </div>
      <div class="quiz-dots">${dots}</div>
      <div class="quiz-q-card">
        <div class="quiz-q-num">Question ${quizIdx+1} of ${quizQuestions.length}</div>
        <div class="quiz-q-text">${q.q}</div>
        <div class="quiz-topic-tag">📌 ${topics[q.topicIdx]?.title || ''}</div>
      </div>
      <div class="quiz-options">${optHtml}</div>
      ${fbHtml}
      <div class="quiz-actions">
        ${answered
          ? (!isLast
              ? `<button class="ctrl-btn primary" onclick="nextQuestion()">Next →</button>`
              : `<button class="ctrl-btn primary" onclick="showResults()">🏁 Results</button>`)
          + `<button class="ctrl-btn" onclick="goToStudyTopic(${q.topicIdx})">📖 Study Topic</button>`
          : `<button class="ctrl-btn" onclick="skipQuestion()">Skip →</button>`}
        <button class="ctrl-btn" onclick="startQuiz()">↺ Restart</button>
      </div>
    </div>`;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function answerQuiz(chosen) {
  if (quizAnswers[quizIdx] !== undefined) return;
  quizAnswers[quizIdx]  = chosen;
  quizCorrects[quizIdx] = chosen === quizQuestions[quizIdx].correct;
  renderQuiz();
}

function skipQuestion() {
  quizAnswers[quizIdx]  = -1;
  quizCorrects[quizIdx] = false;
  nextQuestion();
}

function nextQuestion() {
  if (quizIdx < quizQuestions.length - 1) { quizIdx++; renderQuiz(); }
  else showResults();
}

function showResults() { quizShowResult = true; renderQuiz(); }

function goToStudyTopic(idx) { currentTopic = idx; setMode('study'); }

function renderQuizResults() {
  const mc      = document.getElementById('main-content');
  const total   = quizQuestions.length;
  const correct = Object.values(quizCorrects).filter(Boolean).length;
  const skipped = Object.values(quizAnswers).filter(v => v === -1).length;
  const wrong   = total - correct - skipped;
  const pct     = Math.round((correct / total) * 100);
  const r = 54, circ = 2 * Math.PI * r, dash = (pct / 100) * circ;
  const grade    = pct >= 90 ? '🏆 Excellent!' : pct >= 75 ? '🎯 Great Job!' : pct >= 60 ? '👍 Good Effort' : '📚 Keep Studying';
  const gradeCol = pct >= 90 ? 'var(--accent)' : pct >= 75 ? 'var(--accent3)' : pct >= 60 ? '#ff9944' : 'var(--accent4)';

  const reviewHtml = quizQuestions.map((q, i) => {
    const ans = quizAnswers[i];
    const ok  = quizCorrects[i];
    const icon = ans === -1 ? '⏭' : ok ? '✅' : '❌';
    return `<div class="review-item">
      <span class="review-icon">${icon}</span>
      <div class="review-q">
        <strong>${q.q.replace(/<[^>]*>/g,'')}</strong>
        ${!ok && ans !== -1 ? `<span style="color:var(--accent4);font-size:10.5px;">You: ${q.opts[ans]}</span><br>` : ''}
        ${!ok ? `<span style="color:var(--accent);font-size:10.5px;">Correct: ${q.opts[q.correct]}</span>` : ''}
      </div>
    </div>`;
  }).join('');

  mc.innerHTML = `
    <div class="quiz-results">
      <div class="result-ring">
        <svg width="130" height="130" viewBox="0 0 130 130">
          <circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--border)" stroke-width="10"/>
          <circle cx="65" cy="65" r="${r}" fill="none" stroke="${gradeCol}" stroke-width="10"
            stroke-dasharray="${dash.toFixed(1)} ${circ.toFixed(1)}" stroke-linecap="round"
            style="transition:stroke-dasharray 1s ease"/>
        </svg>
        <div class="result-pct">
          <div class="result-pct-num">${pct}%</div>
          <div class="result-pct-label">SCORE</div>
        </div>
      </div>
      <div class="result-grade" style="color:${gradeCol}">${grade}</div>
      <div class="result-sub">${correct} correct out of ${total} questions</div>
      <div class="result-breakdown">
        <div class="rb-card correct-rb"><div class="rb-num">${correct}</div><div class="rb-lbl">Correct</div></div>
        <div class="rb-card wrong-rb"><div class="rb-num">${wrong}</div><div class="rb-lbl">Wrong</div></div>
        <div class="rb-card skipped-rb"><div class="rb-num">${skipped}</div><div class="rb-lbl">Skipped</div></div>
      </div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px;">
        <button class="ctrl-btn primary" onclick="startQuiz()">↺ Retry Quiz</button>
        <button class="ctrl-btn" onclick="setMode('study')">📖 Back to Study</button>
      </div>
      <div class="review-list">
        <div style="font-size:11px;font-weight:700;margin-bottom:10px;color:var(--muted);font-family:JetBrains Mono,monospace;text-transform:uppercase;letter-spacing:0.08em;">Question Review</div>
        ${reviewHtml}
      </div>
    </div>`;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ─────────────────────────────────────────────────────────────────
// STUDY RENDER
// ─────────────────────────────────────────────────────────────────
function render() {
  appMode = 'study';
  document.getElementById('btn-study').classList.add('active');
  document.getElementById('btn-quiz').classList.remove('active');

  const t      = topics[currentTopic];
  const isDone = doneSet.has(currentTopic);
  const prev   = currentTopic > 0 ? topics[currentTopic - 1] : null;
  const next   = currentTopic < topics.length - 1 ? topics[currentTopic + 1] : null;
  buildNav();

  document.getElementById('main-content').innerHTML = `
    <div class="topic-header">
      <div class="topic-tag"><span class="topic-dot"></span> Topic ${(currentTopic+1).toString().padStart(2,'0')} of ${topics.length.toString().padStart(2,'0')} · ${t.section || 'Basic'}</div>
      <div class="topic-title">${t.title}</div>
      <div class="topic-meta">
        <span class="meta-pill ${t.difficulty}">${difficultyLabel[t.difficulty]}</span>
        <span class="meta-pill">${t.cards.length} sub-topic${t.cards.length>1?'s':''}</span>
        ${isDone ? '<span class="meta-pill" style="border-color:var(--accent);color:var(--accent);">✓ Revised</span>' : ''}
      </div>
    </div>

    <div class="answer-card" style="margin-bottom:18px;background:rgba(0,255,136,0.02);">
      <div class="card-header" style="cursor:default;">
        <div class="card-icon" style="background:${t.iconBg};font-size:17px;">${t.icon}</div>
        <div class="card-q" style="font-size:12.5px;color:var(--muted);">Interview Question</div>
      </div>
      <div class="card-body open" style="padding:16px 20px;">
        <p style="font-size:15px;font-weight:700;color:var(--text);">${t.question}</p>
      </div>
    </div>

    ${buildCards(t.cards, t.id)}

    <button class="mark-done-btn ${isDone?'marked':''}" onclick="markDone(${currentTopic})">
      ${isDone ? '✓ Marked as Revised' : '○ Mark as Revised'}
    </button>

    <div class="nav-controls">
      ${prev ? `<button class="ctrl-btn" onclick="navigate(${currentTopic-1})">← ${prev.title}</button>` : '<span></span>'}
      ${next ? `<button class="ctrl-btn primary" onclick="navigate(${currentTopic+1})">${next.title} →</button>`
             : `<button class="ctrl-btn primary" onclick="navigate(0)">🎉 Start Over</button>`}
    </div>`;

  setTimeout(() => {
    const fb = document.getElementById(`cbody-${t.id}-0`);
    const bb = document.getElementById(`ebtn-${t.id}-0`);
    if (fb && !fb.classList.contains('open')) { fb.classList.add('open'); if(bb) bb.textContent='HIDE'; }
  }, 80);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

render();
</script>
</body>
</html>
